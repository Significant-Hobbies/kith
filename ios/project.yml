name: Kith
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    # Personal Apple Developer team "Sarthak Agrawal". The iCloud container
    # iCloud.com.significanthobbies.kith is created on this team.
    DEVELOPMENT_TEAM: 8F7LXHTJZR
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PersonalSyncKit:
    url: https://github.com/Significant-Hobbies/personal-platform.git
    branch: main
targets:
  KithCore:
    type: framework
    platform: iOS
    sources: Sources/KithCore
    dependencies:
      - sdk: CloudKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.kith.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  Kith:
    type: application
    platform: iOS
    info:
      path: Sources/Kith/Info.plist
      properties:
        CFBundleDisplayName: Kith
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - kith
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    sources:
      - path: Sources/Kith
      - path: Sources/Kith/Resources
        buildPhase: resources
    dependencies:
      - target: KithCore
      - package: PersonalSyncKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.kith
        PRODUCT_NAME: Kith
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Sources/Kith/Kith.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  KithCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/KithCoreTests
    dependencies:
      - target: KithCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.kith.core-tests
        GENERATE_INFOPLIST_FILE: YES
  KithUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/KithUITests
    dependencies:
      - target: Kith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.kith.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kith:
    build:
      targets:
        Kith: all
        KithCoreTests: [test]
        KithUITests: [test]
    test:
      targets:
        - KithCoreTests
        - KithUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
